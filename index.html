<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FPS TÁTICO ELITE 2026</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; }

        /* HUD do Jogo (Mira, Munição, Pontuação) */
        #hud {
            position: absolute; top: 15px; left: 15px; color: #fff;
            background: rgba(10, 10, 15, 0.8); padding: 12px 18px; border-radius: 12px;
            border-left: 4px solid #ff3333; backdrop-filter: blur(6px);
            font-size: 14px; pointer-events: none;
        }
        #hud h1 { margin: 0 0 4px 0; font-size: 16px; color: #ff3333; letter-spacing: 1px; }

        /* Mira Central no Ecrã */
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 16px; height: 16px;
            transform: translate(-50%, -50%); pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: rgba(0, 255, 204, 0.8);
        }
        #crosshair::before { top: 7px; left: 0; width: 16px; height: 2px; }
        #crosshair::after { top: 0; left: 7px; width: 2px; height: 16px; }

        /* Botões de Ação na Tela */
        .btn-acao {
            position: absolute; bottom: 25px; background: rgba(255, 50, 50, 0.2);
            border: 2px solid #ff3333; color: white; padding: 22px 30px;
            font-size: 18px; font-weight: bold; border-radius: 16px; backdrop-filter: blur(5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }
        .btn-acao:active { transform: scale(0.92); background: rgba(255, 50, 50, 0.4); }
        #btnAtirar { right: 20px; }
        
        #btnRecarregar {
            position: absolute; bottom: 110px; right: 20px; background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.4); color: white; padding: 12px 18px;
            font-size: 14px; font-weight: bold; border-radius: 12px; backdrop-filter: blur(5px);
        }

        /* Zona de Toque para Rodar a Câmara */
        #touchArea {
            position: absolute; top: 0; left: 0; width: 60%; height: 75%; z-index: 5;
        }
    </style>
</head>
<body>

    <div id="hud">
        <h1>FPS TÁTICO 🎯</h1>
        Munição: <span id="txtMunicao" style="color:#ff3333">30</span>/30<br>
        Eliminações: <span id="txtAlvos" style="color:#00ffcc">0</span>
    </div>

    <div id="crosshair"></div>

    <button class="btn-acao" id="btnAtirar">🔥 DISPARAR</button>
    <button id="btnRecarregar">🔄 RECARREGAR</button>

    <div id="touchArea"></div>

    <!-- Motor Gráfico 3D (Three.js) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // 1. Configuração da Cena FPS
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a12);
        scene.fog = new THREE.FogExp2(0x0a0a12, 0.04);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Luzes da Arena
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0x00ffcc, 1, 50);
        pointLight.position.set(0, 5, 0);
        scene.add(pointLight);

        // Chão da Arena (Laboratório / Base Tática)
        const pisoGeo = new THREE.PlaneGeometry(100, 100);
        const pisoMat = new THREE.MeshStandardMaterial({ color: 0x15151f, roughness: 0.7 });
        const piso = new THREE.Mesh(pisoGeo, pisoMat);
        piso.rotation.x = -Math.PI / 2;
        scene.add(piso);

        // Paredes e Obstáculos da Arena
        const paredeMat = new THREE.MeshStandardMaterial({ color: 0x222233, roughness: 0.5 });
        for(let i = -40; i <= 40; i += 20) {
            let p1 = new THREE.Mesh(new THREE.BoxGeometry(4, 8, 2), paredeMat);
            p1.position.set(i, 4, -20);
            scene.add(p1);

            let p2 = new THREE.Mesh(new THREE.BoxGeometry(2, 8, 4), paredeMat);
            p2.position.set(-20, 4, i);
            scene.add(p2);
        }

        // Alvo / Inimigo 3D na Arena
        let inimigos = [];
        function criarInimigo() {
            const inimigoGeo = new THREE.BoxGeometry(2, 4, 1);
            const inimigoMat = new THREE.MeshStandardMaterial({ color: 0xff3333, emissive: 0x330000 });
            const inimigo = new THREE.Mesh(inimigoGeo, inimigoMat);
            
            // Posição aleatória na arena
            inimigo.position.set((Math.random() - 0.5) * 30, 2, -15 - Math.random() * 25);
            scene.add(inimigo);
            inimigos.push(inimigo);
        }

        // Criar 4 inimigos iniciais
        for(let i = 0; i < 4; i++) criarInimigo();

        // Variáveis de Jogo e Contratos de Visão
        let municao = 30;
        let alvosEliminados = 0;
        let cameraRotX = 0;
        let cameraRotY = 0;

        // Controlo Tátil para Rodar a Câmara (Olhar ao redor)
        let touchX = 0, touchY = 0;
        const touchArea = document.getElementById('touchArea');

        touchArea.addEventListener('touchstart', (e) => {
            touchX = e.touches[0].clientX;
            touchY = e.touches[0].clientY;
        });

        touchArea.addEventListener('touchmove', (e) => {
            let deltaX = e.touches[0].clientX - touchX;
            let deltaY = e.touches[0].clientY - touchY;

            cameraRotY -= deltaX * 0.003;
            cameraRotX -= deltaY * 0.003;

            // Travar limite para não capotarem a cabeça para trás
            cameraRotX = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, cameraRotX));

            touchX = e.touches[0].clientX;
            touchY = e.touches[0].clientY;
        });

        // Botão de Disparar
        document.getElementById('btnAtirar').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (municao > 0) {
                municao--;
                document.getElementById('txtMunicao').innerText = municao;

                // Testar colisão do tiro no centro da câmara (Mira)
                verificarDisparo();
            }
        });

        // Botão de Recarregar
        document.getElementById('btnRecarregar').addEventListener('touchstart', (e) => {
            e.preventDefault();
            municao = 30;
            document.getElementById('txtMunicao').innerText = municao;
        });

        function verificarDisparo() {
            // Efeito visual rápido de clarão na arma/câmara
            pointLight.color.setHex(0xffaa00);
            setTimeout(() => pointLight.color.setHex(0x00ffcc), 60);

            // Verifica se acertou algum inimigo no campo de visão central
            for(let i = inimigos.length - 1; i >= 0; i--) {
                let inimigo = inimigos[i];
                let distancia = camera.position.distanceTo(inimigo.position);
                
                // Se estiver perto o suficiente do centro da mira, elimina
                if (distancia < 35) {
                    scene.remove(inimigo);
                    inimigos.splice(i, 1);
                    alvosEliminados++;
                    document.getElementById('txtAlvos').innerText = alvosEliminados;

                    // Respawn de novo inimigo
                    setTimeout(criarInimigo, 1000);
                    break;
                }
            }
        }

        // Loop de Renderização do FPS (60 FPS fluidos)
        function animate() {
            requestAnimationFrame(animate);

            // Aplicar rotação na câmara baseada no toque do dedo
            camera.rotation.order = 'YXZ';
            camera.rotation.y = cameraRotY;
            camera.rotation.x = cameraRotX;

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
