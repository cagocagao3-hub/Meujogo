<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GRAU BRASIL ELITE 2D</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body { margin: 0; background: #050508; overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; }

        /* HUD Estilo Jogo de Console Profissional */
        #hud {
            position: absolute; top: 15px; left: 15px; color: #fff;
            background: rgba(12, 12, 20, 0.85); padding: 12px 18px; border-radius: 14px;
            border-left: 5px solid #00ffcc; backdrop-filter: blur(8px);
            font-size: 14px; pointer-events: none; box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }
        #hud h1 { margin: 0 0 4px 0; font-size: 17px; color: #00ffcc; letter-spacing: 1px; }

        /* Botões de Controle Profissionais */
        .btn-ctrl {
            position: absolute; bottom: 25px; background: rgba(255, 255, 255, 0.12);
            border: 2px solid rgba(255, 255, 255, 0.35); color: white; padding: 22px 28px;
            font-size: 17px; font-weight: bold; border-radius: 18px; backdrop-filter: blur(6px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }
        .btn-ctrl:active { transform: scale(0.92); background: rgba(255, 255, 255, 0.3); }
        #btnAcelerar { right: 20px; border-color: #00ffcc; background: rgba(0, 255, 204, 0.2); }
        #btnFreio { right: 165px; border-color: #ff3333; background: rgba(255, 50, 50, 0.2); }
        #btnGrau { left: 20px; border-color: #ffaa00; background: rgba(255, 170, 0, 0.2); }
    </style>
</head>
<body>

    <div id="hud">
        <h1>GRAU BRASIL ELITE ⚡</h1>
        Velocidade: <span id="txtVel" style="color:#00ffcc">0</span> km/h<br>
        Ângulo do Grau: <span id="txtAng" style="color:#ffaa00">0</span>°<br>
        Status: <span id="txtStatus" style="color:#fff">No Chão</span>
    </div>

    <button class="btn-ctrl" id="btnGrau">⚖️ GRAU</button>
    <button class="btn-ctrl" id="btnFreio">🛑 FREIO</button>
    <button class="btn-ctrl" id="btnAcelerar">🚀 ACELERAR</button>

    <script>
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        document.body.appendChild(canvas);

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        // Variáveis do Jogo
        let motoX = 180;
        let velocidade = 0;
        let angulo = 0;
        let acelerando = false;
        let freando = false;
        let empinando = false;
        let distanciaFundo = 0;

        // Controles Touch
        document.getElementById('btnAcelerar').addEventListener('touchstart', (e) => { e.preventDefault(); acelerando = true; });
        document.getElementById('btnAcelerar').addEventListener('touchend', () => { acelerando = false; });
        document.getElementById('btnFreio').addEventListener('touchstart', (e) => { e.preventDefault(); freando = true; });
        document.getElementById('btnFreio').addEventListener('touchend', () => { freando = false; });
        document.getElementById('btnGrau').addEventListener('touchstart', (e) => { e.preventDefault(); empinando = true; });
        document.getElementById('btnGrau').addEventListener('touchend', () => { empinando = false; });

        function update() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Céu Noturno Estilizado
            let gradCeu = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradCeu.addColorStop(0, '#020205');
            gradCeu.addColorStop(0.7, '#111122');
            gradCeu.addColorStop(1, '#1f1b24');
            ctx.fillStyle = gradCeu;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Prédios da Cidade no Fundo (Movimento Parallax)
            distanciaFundo += velocidade * 0.1;
            let larguraPredio = 90;
            ctx.fillStyle = '#0b0b12';
            for (let i = -2; i < (canvas.width / larguraPredio) + 3; i++) {
                let xPos = (i * larguraPredio) - (distanciaFundo % larguraPredio);
                let alturaPredio = 220 + (Math.sin(i * 123) * 80);
                ctx.fillRect(xPos, canvas.height - 220 - alturaPredio, larguraPredio - 10, alturaPredio);
                
                // Janelas iluminadas dos prédios
                ctx.fillStyle = '#ffd166';
                for(let j = 0; j < 3; j++) {
                    ctx.fillRect(xPos + 15 + (j * 20), canvas.height - 200 - alturaPredio + (j * 30), 8, 12);
                }
                ctx.fillStyle = '#0b0b12';
            }

            // 3. Pista / Asfalto Realista
            let yAsfalto = canvas.height - 150;
            ctx.fillStyle = '#181820';
            ctx.fillRect(0, yAsfalto, canvas.width, 150);

            // Linhas amarelas da pista passando
            ctx.fillStyle = '#f39c12';
            let offsetFaixa = (distanciaFundo * 2) % 60;
            for (let x = -offsetFaixa; x < canvas.width; x += 60) {
                ctx.fillRect(x, yAsfalto + 65, 35, 6);
            }

            // 4. Física da Moto e Grau
            if (acelerando) {
                if (velocidade < 160) velocidade += 0.8;
            } else {
                if (velocidade > 0) velocidade -= 0.5;
            }
            if (freando && velocidade > 0) velocidade -= 2.5;

            let statusTxt = "No Chão";
            let corSt = "#00ffcc";

            if (empinando && velocidade > 12) {
                if (angulo < 65) angulo += 1.6;
                statusTxt = angulo > 50 ? "🔥 NA CHAPA!" : "Empinando...";
                corSt = "#ffaa00";
            } else {
                if (angulo > 0) angulo -= 2.0;
            }

            if (angulo > 66) {
                statusTxt = "💥 CAPOTOU!";
                corSt = "#ff3333";
                angulo = 0;
                velocidade = 0;
            }

            // 5. Desenho Detalhado da Moto (Estilo Esportivo)
            ctx.save();
            ctx.translate(motoX, yAsfalto - 20);
            ctx.rotate(-angulo * Math.PI / 180);

            // Fumaça no pneu traseiro ao acelerar forte no grau
            if (empinando && acelerando && Math.random() > 0.4) {
                ctx.fillStyle = "rgba(255,255,255,0.3)";
                ctx.beginPath();
                ctx.arc(-35, 10, Math.random() * 10 + 5, 0, Math.PI * 2);
                ctx.fill();
            }

            // Rodas
            ctx.fillStyle = '#111';
            ctx.beginPath();
            ctx.arc(-35, 15, 15, 0, Math.PI * 2); // Traseira
            ctx.arc(38, 15, 15, 0, Math.PI * 2);  // Dianteira
            ctx.fill();
            ctx.strokeStyle = '#444'; ctx.lineWidth = 4; ctx.stroke();

            // Carenagem Principal / Chassi Esportivo
            ctx.fillStyle = '#e63946'; // Vermelho Elite
            ctx.beginPath();
            ctx.moveTo(-30, -5);
            ctx.lineTo(30, -10);
            ctx.lineTo(45, 10);
            ctx.lineTo(-30, 10);
            ctx.closePath();
            ctx.fill();

            // Tanque e Banco
            ctx.fillStyle = '#1d3557';
            ctx.fillRect(-12, -26, 32, 16);

            // Piloto com Capacete
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(2, -35, 11, 0, Math.PI * 2); // Capacete
            ctx.fill();

            ctx.restore();

            // Atualizar Informações na Tela (HUD)
            document.getElementById('txtVel').innerText = Math.floor(velocidade);
            document.getElementById('txtAng').innerText = Math.floor(angulo);
            let elSt = document.getElementById('txtStatus');
            elSt.innerText = statusTxt;
            elSt.style.color = corSt;

            requestAnimationFrame(update);
        }

        requestAnimationFrame(update);
    </script>
</body>
</html>
